name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BACKEND_PORTFOLIO }}
          # GitHub forbids secret names that start with 'GITHUB_'. Use DEV_GITHUB_USERNAME instead.
          DEV_GITHUB_USERNAME: ${{ secrets.DEV_GITHUB_USERNAME }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [ -n "$RAILWAY_TOKEN" ]; then
            export RAILWAY_TOKEN="$RAILWAY_TOKEN"
          elif [ -n "$RAILWAY_API_TOKEN" ]; then
            export RAILWAY_TOKEN="$RAILWAY_API_TOKEN"
          else
            echo "No Railway token was provided. Add RAILWAY_TOKEN or RAILWAY_API_TOKEN to GitHub Secrets."
            exit 1
          fi

          if [ -n "$DEV_GITHUB_USERNAME" ]; then
            export GITHUB_USERNAME="$DEV_GITHUB_USERNAME"
          fi

          SERVICE_ARGS=()
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            SERVICE_ARGS+=(--service "$RAILWAY_SERVICE_ID")
          fi

          if ! railway whoami; then
            echo "Railway authentication failed. Verify the token in GitHub Secrets is valid and belongs to the target Railway project or workspace."
            exit 1
          fi

          railway up --ci --detach --yes "${SERVICE_ARGS[@]}"
