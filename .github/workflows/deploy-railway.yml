name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub forbids secret names that start with 'GITHUB_'. Use DEV_GITHUB_USERNAME instead.
          DEV_GITHUB_USERNAME: ${{ secrets.DEV_GITHUB_USERNAME }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is missing or empty. Add a valid Railway token to GitHub secrets before deploying."
            exit 1
          fi
          if [ -n "$DEV_GITHUB_USERNAME" ]; then
            export GITHUB_USERNAME="$DEV_GITHUB_USERNAME"
          fi

          SERVICE_ARGS=()
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            SERVICE_ARGS+=(--service "$RAILWAY_SERVICE_ID")
          fi

          if ! railway whoami; then
            echo "Railway authentication failed. Verify that RAILWAY_TOKEN is a valid project or account token for the target Railway project."
            exit 1
          fi

          railway up --ci --detach --yes "${SERVICE_ARGS[@]}"
